<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#121314">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SR-28">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
*,::before,::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
</style>
<title>SORANE SR-28</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Yomogi&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D stage; name plate + tape status top-left; transport chips docked at the bottom */
:root{
  --stage:#121314;
  --stage-hi:#2b2d2f;
  --ink:#ece7dc;
  --muted:#8f8b82;
  --line:rgba(236,231,220,.16);
  --glass:rgba(18,19,20,.62);
  --accent:#e2553b;
  --f-display:'Michroma','Eurostile','Arial Narrow',sans-serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--stage);color:var(--ink);font-family:var(--f-body);
  overflow:hidden;-webkit-user-select:none;user-select:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#stage{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 40%,var(--stage-hi) 0%,var(--stage) 64%)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
#stage canvas.hot{cursor:pointer}

.plate{
  position:fixed;z-index:2;pointer-events:none;
  top:calc(env(safe-area-inset-top,0px) + 18px);
  left:max(16px,env(safe-area-inset-left,0px));
  right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:6px;
}
.model{font-family:var(--f-display);font-size:22px;letter-spacing:.08em;line-height:1}
.maker{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.status{
  margin-top:6px;display:flex;align-items:center;gap:10px;
  font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;font-variant-numeric:tabular-nums;
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:background .2s,box-shadow .2s}
.dot.on{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.sep{width:1px;height:12px;background:var(--line)}
.ctr{
  padding:2px 6px;border:1px solid var(--line);border-radius:3px;
  background:rgba(0,0,0,.35);letter-spacing:.22em;
}
.tape{font-size:12px;color:var(--muted)}

#loading{
  position:fixed;inset:0;display:grid;place-items:center;z-index:1;
  font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--muted);
  padding:0 24px;text-align:center;
}

.dock{
  position:fixed;z-index:2;
  left:max(16px,env(safe-area-inset-left,0px));
  right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  display:grid;gap:10px;justify-items:center;
}
.hint{margin:0;font-size:12px;color:var(--muted);text-align:center;text-wrap:balance;max-width:34em}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{
  font:inherit;font-size:13px;color:var(--ink);
  padding:10px 15px;border-radius:999px;border:1px solid var(--line);
  background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  cursor:pointer;transition:border-color .15s,background .15s,transform .1s;
}
.chip:hover{border-color:rgba(236,231,220,.36)}
.chip:active{transform:translateY(1px)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip.primary{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--glass))}
.chip[aria-pressed="false"]{color:var(--muted)}
.chip .mono{font-family:var(--f-mono);margin-right:4px}
.plate,.dock{transition:opacity .35s ease,visibility .35s}
body.player .plate,body.player .dock{opacity:0;visibility:hidden;pointer-events:none}
#bExit{
  position:fixed;z-index:3;
  bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  left:max(14px,env(safe-area-inset-left,0px));
  padding:8px 13px;font-size:12px;opacity:.7;
}
#bExit:hover,#bExit:focus-visible{opacity:1}
.phint{
  position:fixed;z-index:3;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 64px);
  width:max-content;max-width:calc(100% - 32px);
  padding:9px 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  font-size:12px;line-height:1.6;text-align:center;text-wrap:balance;
  transition:opacity .5s;pointer-events:none;
}
.phint.fade{opacity:0}
body.rack .plate,body.rack .dock{opacity:0;visibility:hidden;pointer-events:none}
.rackbar{
  position:fixed;z-index:3;display:none;align-items:center;gap:12px;
  top:calc(env(safe-area-inset-top,0px) + 12px);
  left:max(14px,env(safe-area-inset-left,0px));
}
body.rack .rackbar{display:flex}
.rack-title{font-family:var(--f-display);font-size:12px;letter-spacing:.16em;text-shadow:0 1px 8px rgba(0,0,0,.6)}
#fade{position:fixed;inset:0;z-index:5;background:var(--stage);opacity:0;pointer-events:none;transition:opacity .28s ease}
#fade.on{opacity:1}
.sheet{
  position:fixed;z-index:6;
  left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  max-width:440px;margin:0 auto;padding:18px;border-radius:16px;
  background:rgba(24,25,27,.95);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 18px 50px rgba(0,0,0,.45);
  display:grid;gap:14px;
}
.sheet-body{display:grid;gap:8px}
.sheet-title{margin:0;font-size:16px;font-weight:700;line-height:1.5}
.sheet-sub{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
.sheet label{font-size:12px;color:var(--muted);margin-top:4px}
.sheet input{
  font:inherit;font-size:16px;color:var(--ink);width:100%;box-sizing:border-box;
  background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:11px 12px;
}
.sheet input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.chip.danger{border-color:#d64a3a;background:rgba(214,74,58,.24)}
@media (prefers-reduced-motion: reduce){#fade{transition:none}}

@media (prefers-reduced-motion: reduce){.chip,.dot{transition:none}}
@media (orientation: landscape){
  #bExit{bottom:auto;left:auto;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(14px,env(safe-area-inset-right,0px))}
}
</style>
</head>
<body>


<div id="stage"></div>

<header class="plate">
  <div class="model">SR-28</div>
  <div class="maker">Sorane · Stereo Cassette Player</div>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="mode">STOP</span>
    <span class="sep"></span>
    <span class="ctr" id="ctr">000</span>
  </div>
  <div class="tape" id="tapeName">C-46 · SIDE A · 秋の帰り道 mix</div>
</header>

<div id="loading">LOADING…</div>

<footer class="dock">
  <p class="hint" id="hint">ドラッグで回転、ピンチで拡大。キーやフタも押せます。フタを開けてカセットをタップすると、テープラックに切り替わります。</p>
  <div class="chips">
    <button id="bPlay" class="chip primary" type="button"><span class="mono">▶</span>再生</button>
    <button id="bPlayer" class="chip" type="button">全画面プレーヤー</button>
    <button id="bSongs" class="chip" type="button">テープラック</button>
    <button id="bDoor" class="chip" type="button">フタを開ける</button>
    <button id="bAuto" class="chip" type="button" aria-pressed="true">自動回転</button>
    <button id="bReset" class="chip" type="button">視点リセット</button>
  </div>
</footer>

<button id="bExit" class="chip" type="button" hidden>終了</button>
<div class="phint fade" id="pHint" aria-live="polite"></div>
<div class="rackbar" id="rackBar">
  <button id="bRackBack" class="chip" type="button">戻る</button>
  <span class="rack-title">TAPE RACK</span>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div id="fade"></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/RoomEnvironment.js"></script>
<script>
(function(){
const $ = s => document.querySelector(s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function fontsReady(){
  try{
    return Promise.race([
      Promise.all([
        document.fonts.load('400 64px Michroma'),
        document.fonts.load('400 64px Yomogi'),
        document.fonts.load('500 32px "IBM Plex Mono"'),
        document.fonts.load('700 32px "Zen Kaku Gothic New"')
      ]),
      new Promise(r => setTimeout(r, 2500))
    ]).catch(()=>{});
  }catch(e){ return Promise.resolve(); }
}

fontsReady().then(init);

function init(){
  if(!window.THREE || !THREE.OrbitControls){
    $('#loading').textContent = '3Dの読み込みに失敗しました。通信を確認して、ページを再読み込みしてください。';
    return;
  }
  const stage = $('#stage');
  const dpr = window.devicePixelRatio || 1;
  const renderer = new THREE.WebGLRenderer({antialias:dpr < 2, alpha:true, powerPreference:'low-power'});
  renderer.setPixelRatio(Math.min(dpr, 2));
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.92;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  stage.appendChild(renderer.domElement);
  $('#loading').hidden = true;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, stage.clientWidth / stage.clientHeight, 0.1, 300);

  // ---------- environment & lights ----------
  if(THREE.RoomEnvironment){
    const pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
  }
  scene.add(new THREE.HemisphereLight(0xfff4e6, 0x1a1a1a, scene.environment ? 0.25 : 0.7));
  const key = new THREE.DirectionalLight(0xfff1e0, 1.5);
  key.position.set(8, 16, 11);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  const sc = key.shadow.camera; sc.left = -14; sc.right = 14; sc.top = 14; sc.bottom = -14; sc.near = 1; sc.far = 50;
  key.shadow.bias = -0.0008; key.shadow.radius = 4;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x9fc4ff, 0.55);
  rim.position.set(-12, 5, -9);
  scene.add(rim);

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({opacity:0.38}));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -4.87;
  ground.receiveShadow = true;
  scene.add(ground);

  // ---------- helpers ----------
  const aniso = renderer.capabilities.getMaxAnisotropy();
  function canvasTex(w, h, draw, scale = 1){
    const c = document.createElement('canvas'); c.width = Math.round(w * scale); c.height = Math.round(h * scale);
    const g = c.getContext('2d'); if(scale !== 1) g.scale(scale, scale); draw(g, w, h);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding; t.anisotropy = Math.min(4, aniso);
    return t;
  }
  function spaced(g, text, x, y, sp){
    for(const ch of text){ g.fillText(ch, x, y); x += g.measureText(ch).width + sp; }
  }
  function roundRect(g, x, y, w, h, r){
    g.beginPath();
    g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function decal(w, h, tex, opts = {}){
    const m = new THREE.MeshStandardMaterial({
      map:tex, transparent:true, roughness:opts.rough ?? 0.6, metalness:0,
      polygonOffset:true, polygonOffsetFactor:-2, depthWrite:false
    });
    m.userData.disposable = true;
    return new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
  }
  function rrShape(w, h, r, cx = 0, cy = 0, PathType = THREE.Shape){
    const s = new PathType(); const x = cx - w / 2, y = cy - h / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }
  // rounded slab spanning z = 0..depth, with optional rounded-rect holes
  function slab(w, h, r, depth, bevel, holes = []){
    const s = rrShape(w - 2 * bevel, h - 2 * bevel, Math.max(0.02, r - bevel));
    holes.forEach(o => s.holes.push(rrShape(o.w + 2 * bevel, o.h + 2 * bevel, o.r + bevel, o.x, o.y, THREE.Path)));
    const geo = new THREE.ExtrudeGeometry(s, {
      depth:depth - 2 * bevel, bevelEnabled:true, bevelThickness:bevel, bevelSize:bevel,
      bevelSegments:4, curveSegments:18
    });
    geo.translate(0, 0, bevel);
    return geo;
  }
  const shadowy = m => { m.castShadow = true; m.receiveShadow = true; return m; };

  // ---------- materials ----------
  const bodyMat = new THREE.MeshStandardMaterial({color:0x93a596, roughness:0.55, metalness:0.0});
  const graphite = new THREE.MeshStandardMaterial({color:0x2a2c2f, roughness:0.38, metalness:0.25});
  const darkMat = new THREE.MeshStandardMaterial({color:0x141516, roughness:0.85});
  const metal = new THREE.MeshStandardMaterial({color:0xc9ccd0, roughness:0.28, metalness:1.0});
  const darkPlastic = new THREE.MeshStandardMaterial({color:0x232528, roughness:0.4});
  const tapeMat = new THREE.MeshStandardMaterial({color:0x3b2a20, roughness:0.45, metalness:0.1});
  const hubMat = new THREE.MeshStandardMaterial({color:0xf2efe8, roughness:0.4});
  const glassMat = new THREE.MeshStandardMaterial({
    color:0xbcd0d8, transparent:true, opacity:0.16, roughness:0.04, metalness:0.1,
    envMapIntensity:1.6, depthWrite:false
  });
  const keyLight = new THREE.MeshStandardMaterial({color:0xd8d2c4, roughness:0.5});
  const keyCoral = new THREE.MeshStandardMaterial({color:0xe2553b, roughness:0.45});

  [bodyMat, graphite, darkMat, darkPlastic, tapeMat, hubMat, keyLight, keyCoral].forEach(m => { m.envMapIntensity = 0.55; });
  const player = new THREE.Group();
  scene.add(player);
  const W = 13, H = 9.4, D = 3, TOP = H / 2;

  // ---------- body: back shell + front frame (parting line between) ----------
  const back = shadowy(new THREE.Mesh(slab(W, H, 0.9, 2, 0.18), bodyMat));
  back.position.z = -1.5;
  player.add(back);
  const bay = {w:10.6, h:6.4, x:0, y:-0.7};
  const front = shadowy(new THREE.Mesh(slab(W, H, 0.9, 1, 0.18, [{w:bay.w, h:bay.h, r:0.35, x:bay.x, y:bay.y}]), bodyMat));
  front.position.z = 0.5;
  player.add(front);

  // bay interior
  const bayFloor = new THREE.Mesh(new THREE.PlaneGeometry(bay.w, bay.h), darkMat);
  bayFloor.position.set(0, bay.y, 0.505);
  player.add(bayFloor);
  const mainSpindles = [-2.1, 2.1].map(x => {
    const sp = makeSpindle(0.655); sp.position.set(x, bay.y + 0.15, 0.505);
    player.add(sp); return sp;
  });
  const head = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.45, 0.3), metal);
  head.position.set(0, -3.6, 0.7);
  player.add(head);

  // brand band
  const brandTex = canvasTex(2400, 340, (g) => {
    g.fillStyle = '#23262a';
    g.font = '400 112px Michroma, "Arial Narrow", sans-serif';
    spaced(g, 'SORANE', 70, 210, 26);
    g.fillStyle = '#e2553b';
    g.fillRect(74, 252, 64, 10);
    g.fillStyle = '#2c3034';
    g.textAlign = 'right';
    g.font = '500 34px "IBM Plex Mono", monospace';
    g.fillText('S T E R E O   C A S S E T T E   P L A Y E R', 2330, 140);
    g.font = '400 72px Michroma, "Arial Narrow", sans-serif';
    g.fillText('SR-28', 2330, 250);
  }, 0.7);
  const brand = decal(12, 1.7, brandTex);
  brand.position.set(0, 3.62, 1.502);
  player.add(brand);

  // ---------- cassette ----------
  let labelTitle = '秋の帰り道 mix', labelSub = '2026.10  for the walk home', labelColor = '#e2553b', labelC = 'C-46';
  function paintLabel(g, w, h){
    g.fillStyle = '#26282b'; g.fillRect(0, 0, w, h);
    // label
    roundRect(g, 40, 28, 920, 404, 18); g.fillStyle = '#efe7d3'; g.fill();
    g.save(); roundRect(g, 40, 28, 920, 404, 18); g.clip();
    g.fillStyle = labelColor; g.fillRect(40, 28, 920, 46);
    g.fillStyle = '#d9a441'; g.fillRect(40, 74, 920, 14);
    g.restore();
    g.fillStyle = '#efe7d3'; g.font = '500 26px "IBM Plex Mono", monospace';
    g.fillText(labelC, 870, 60);
    // side letter
    g.beginPath(); g.arc(98, 140, 30, 0, Math.PI * 2); g.fillStyle = '#2a2c2f'; g.fill();
    g.fillStyle = '#efe7d3'; g.font = '700 36px "Zen Kaku Gothic New", sans-serif';
    g.textAlign = 'center'; g.fillText('A', 98, 153); g.textAlign = 'left';
    // writing lines + handwritten title
    g.strokeStyle = 'rgba(42,44,47,.25)'; g.lineWidth = 2;
    [168, 404].forEach(y => { g.beginPath(); g.moveTo(150, y); g.lineTo(930, y); g.stroke(); });
    g.fillStyle = '#2a2c2f';
    let fs = 50; g.font = `400 ${fs}px Yomogi, cursive`;
    while(fs > 28 && g.measureText(labelTitle).width > 770){ fs -= 2; g.font = `400 ${fs}px Yomogi, cursive`; }
    let tt = labelTitle;
    while(tt.length > 1 && g.measureText(tt).width > 770) tt = tt.slice(0, -2) + '…';
    g.fillText(tt, 152, 158);
    g.font = '400 30px Yomogi, cursive'; g.textAlign = 'right';
    g.fillText(labelSub, 930, 396); g.textAlign = 'left';
    // window
    g.save();
    roundRect(g, 180, 208, 640, 172, 24);
    g.globalCompositeOperation = 'destination-out'; g.fill();
    g.restore();
    roundRect(g, 180, 208, 640, 172, 24);
    g.fillStyle = 'rgba(200,220,232,.10)'; g.fill();
    g.strokeStyle = 'rgba(20,20,22,.9)'; g.lineWidth = 6; g.stroke();
    // remaining-tape scale
    g.fillStyle = 'rgba(240,236,226,.7)';
    for(let i = 0; i <= 12; i++){
      const x = 380 + i * 20;
      g.fillRect(x, 352, 2, i % 6 === 0 ? 18 : 10);
    }
    g.font = '500 14px "IBM Plex Mono", monospace'; g.textAlign = 'center';
    g.fillText('0', 381, 346); g.fillText('15', 501, 346); g.fillText('30', 621, 346);
    g.textAlign = 'left';
    // lower shell: head-access area
    g.fillStyle = '#2d3034';
    g.beginPath(); g.moveTo(190, 620); g.lineTo(240, 462); g.lineTo(760, 462); g.lineTo(810, 620); g.closePath(); g.fill();
    g.fillStyle = '#0e0f10';
    [[290, 540, 34, 34], [676, 540, 34, 34], [468, 552, 64, 40]].forEach(r => g.fillRect(...r));
    [[350, 590], [650, 590]].forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 13, 0, Math.PI * 2); g.fill(); });
    // screws
    [[24, 22], [976, 22], [24, 598], [976, 598], [500, 450]].forEach(([x, y]) => {
      g.beginPath(); g.arc(x, y, 11, 0, Math.PI * 2); g.fillStyle = '#4a4e53'; g.fill();
      g.strokeStyle = '#1b1c1e'; g.lineWidth = 3;
      g.beginPath(); g.moveTo(x - 6, y); g.lineTo(x + 6, y); g.moveTo(x, y - 6); g.lineTo(x, y + 6); g.stroke();
    });
    g.fillStyle = 'rgba(239,231,211,.55)'; g.font = '500 16px "IBM Plex Mono", monospace';
    g.fillText('NORMAL POSITION · TYPE I', 40, 452);
  }
  const labelTex = canvasTex(1000, 620, paintLabel);
  function relabel(){

      ? (demoBuf ? [{name:'秋の帰り道', dur:demoBuf.duration, buf:demoBuf, keep:true}] : [])

    try{

      const chords = [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60, 64], [48, 52, 55, 59]];
      const roots = [41, 40, 38, 36];
      const scale = [72, 74, 76, 79, 81, 84];

        const t0 = 0.4 + b * bar, c = chords[b % 4], r = roots[b % 4];
        c.forEach(m => {
          [0, beat * 2.5].forEach(off => {

            tone(keysBus, t0 + off, mtof(m + 12), 0.9, 'triangle', 0.012, 0.005);

        });

          tone(out, t0 + beat * 2.5, mtof(r + 7), beat * 1.2, 'sine', 0.16, 0.01);

    }, [
      {label:'やめる'},
      {label:'テープを作る', kind:'primary', fn:() => createTape(list, (input.value || '').trim() || def, mins)}
    ]);
  });
  function createTape(list, title, mins){
    const rec = {
      id:'t' + Date.now().toString(36), title,
      sub:`${list.length} TRACK${list.length > 1 ? 'S' : ''}  ·  ${mins} MIN`,
      color:PALETTE[tapes.length % PALETTE.length],
      files:list.map(t => ({name:t.name, blob:t.blob, dur:t.dur})), pos:0, mins, created:Date.now()
    };
    tapes.push(rec); saveTape(rec);
    buildRack(); fitRackCam();
    const c = R.cases[rec.id]; c.slide = 1.6; c.target = 0; c.wasOut = true;
    rackYT = clampRack(c.y0);
    sfx('slide');
  }
  function askDelete(id){
    const rec = tapes.find(t => t.id === id); if(!rec || rec.demo) return;
    showSheet(b => {
      para(b, 'sheet-title', `「${rec.title}」を捨てますか？`);
      para(b, 'sheet-sub', 'ラックから消え、録音した曲もこのブラウザから削除されます。');
    }, [
      {label:'やめる'},
      {label:'捨てる', kind:'danger', fn:() => {
        tapes.splice(tapes.indexOf(rec), 1); dropTape(rec);
        const t = spineCache.get(rec.id); if(t) t.dispose(); spineCache.delete(rec.id);
        if(current === rec) current = demoRec;
        buildRack(); fitRackCam(); sfx('rackIn');
      }}
    ]);
  }

  // ----- tweens + fades -----
  const tweens = [];
  function tween(obj, key, to, dur, ease, done){
    for(let i = tweens.length - 1; i >= 0; i--) if(tweens[i].obj === obj && tweens[i].key === key) tweens.splice(i, 1);
    tweens.push({obj, key, from:obj[key], to, dur:reduceMotion ? 0.01 : dur, t:0, ease, done});
  }
  function runTweens(dt){
    for(let i = tweens.length - 1; i >= 0; i--){
      const w = tweens[i]; w.t += dt;
      const k = Math.min(1, w.t / w.dur);
      const e = w.ease === 'in' ? k * k * k : w.ease === 'out' ? 1 - Math.pow(1 - k, 3) : (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
      w.obj[w.key] = w.from + (w.to - w.from) * e;
      if(k >= 1){ tweens.splice(i, 1); if(w.done) w.done(); }
    }
  }
  const fadeEl = $('#fade');
  function fadeSwap(fn){
    fadeEl.classList.add('on');
    setTimeout(() => {
      try{ const r = fn(); if(r && r.catch) r.catch(err => { console.error(err); busy = false; }); }
      catch(err){ console.error(err); busy = false; }
      finally{ requestAnimationFrame(() => requestAnimationFrame(() => fadeEl.classList.remove('on'))); }
    }, reduceMotion ? 20 : 300);
  }
  const later = (ms, fn) => setTimeout(fn, reduceMotion ? 0 : ms);

  // ----- eject → rack, rack → insert -----
  // a timeline of steps; each step waits for the last, so the motion reads one action at a time
  function sequence(steps){
    let t = 0;
    steps.forEach(([wait, fn]) => { t += wait; later(t, fn); });
  }
  function ejectToRack(){
    if(busy || rackMode) return;
    busy = true;
    ensureAudio();
    const wasPlaying = state.mode !== 'stop';
    if(wasPlaying) setMode('stop');
    current.pos = state.pos; saveTape(current);
    const closed = !state.doorTarget;
    sequence([
      // 1. door unlatches and swings all the way open in one motion
      [wasPlaying ? 300 : 0, () => { if(closed) setDoor(true); tween(casAnim, 'wide', 1, 0.45, 'out'); }],
      // 2. the spring kicks the cassette up out of its seat
      [closed ? 420 : 120, () => { sfx('eject'); tween(casAnim, 'out', 0.35, 0.14, 'out'); }],
      // 3. it is lifted clear of the bay
      [260, () => { sfx('lift'); tween(casAnim, 'out', 1, 0.32, 'out'); }],
      // 4. and carried away
      [330, () => { sfx('slide'); tween(casAnim, 'slide', 1, 0.5, 'in'); }],
      [380, () => fadeSwap(enterRack)]
    ]);
  }
  function enterRack(){
    returnTo = playerMode ? 'player' : 'orbit';
    rackMode = true;
    document.body.classList.add('rack');
    bExit.hidden = true;
    controls.enabled = false;
    Object.assign(casAnim, {out:1, slide:1, tilt:0, wide:1});
    buildRack(); fitRackCam();
    const c = R.cases[current.id];
    if(c){ c.slide = 1.5; c.target = 0; c.wasOut = true; rackY = rackYT = clampRack(c.y0); }
    else rackY = rackYT = R.minY;
    flashHint('テープをタップして入れる。長押しで捨てる。手前の空テープで新しく作れます。');
    busy = false;
  }
  function chooseTape(rec){
    if(busy || !rec) return;
    busy = true;
    ensureAudio();
    const c = R && R.cases[rec.id];
    if(c){ c.target = 1.2; sfx('slide'); }
    later(430, () => fadeSwap(() => leaveRack(rec)));
  }
  async function leaveRack(rec){
    rackMode = false;
    document.body.classList.remove('rack');
    if(returnTo === 'player'){ bExit.hidden = false; }
    else { controls.enabled = true; }
    pHint.classList.add('fade');
    state.doorTarget = 1; state.door = 1; syncUI();
    Object.assign(casAnim, {out:1, slide:1, tilt:0, wide:1});
    current = rec;
    try{ await Promise.race([prepareTape(rec), new Promise(r => setTimeout(r, 8000))]); }catch(e){}
    setTape(rec);
    state.pos = Math.min(rec.pos || 0, tape.total);
    sequence([
      // 1. the cassette is brought in and held in front of the bay
      [450, () => { sfx('slide'); tween(casAnim, 'slide', 0, 0.85, 'out'); }],
      // 2. lined up, then pushed home — スチャッ
      [1100, () => tween(casAnim, 'out', 0, 0.2, 'in', () => sfx('insert'))],
      // 3. the door comes back up and shuts with a click
      [450, () => { tween(casAnim, 'wide', 0, 0.25, 'out'); setDoor(false); }],
      [550, () => { busy = false; }]
    ]);
  }
  $('#bRackBack').addEventListener('click', () => { if(rackMode && !sheetOpen) chooseTape(current); });
  $('#bSongs').addEventListener('click', ejectToRack);

  function rackPick(e){
    if(!R) return null;
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, rackCam);
    const objs = Object.values(R.cases).map(c => c.mesh); objs.push(R.blank);
    const h = ray.intersectObjects(objs, false)[0];
    return h ? h.object : null;
  }
  function updateRack(dt){
    Object.values(R.cases).forEach(c => {
      c.slide += (c.target - c.slide) * Math.min(1, dt * 9);
      if(c.slide > 0.5) c.wasOut = true;
      if(c.target === 0 && c.wasOut && c.slide < 0.05){ c.wasOut = false; sfx('rackIn'); }
      c.g.position.z = c.slide * 6.5;
      c.g.position.y = c.y0 + c.slide * 1.3;
      c.g.rotation.x = -c.slide * 0.22;
    });
    rackY += (rackYT - rackY) * Math.min(1, dt * 10);
    rackCam.position.set(0, rackY + R.dist * 0.3, R.dist);
    rackCam.lookAt(0, rackY, 0);
  }

  const pickables = [];
  Object.values(keys).forEach(k => { pickables.push(k.mesh); k.mesh.children.forEach(c => pickables.push(c)); });
  [door, glass, doorText].forEach(m => { m.userData.act = 'door'; pickables.push(m); });
  mainCas.shell.userData.act = 'cassette'; pickables.push(mainCas.shell);
  pickables.push(wheel);
  function pick(e){
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    if(playerMode && pm){ ray.setFromCamera(ndc, pmCam); }
    else ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(playerMode && pm ? pm.picks : pickables, false)[0];
    return hit ? hit.object.userData.act : null;
  }
  let down = null;
  let rackDown = null, lpTimer = 0;
  renderer.domElement.addEventListener('pointerdown', e => {
    if(rackMode){
      if(!R || busy || sheetOpen) return;
      ensureAudio();
      const o = rackPick(e);
      rackDown = {x:e.clientX, y:e.clientY, y0:rackYT, obj:o, moved:false, long:false};
      try{ renderer.domElement.setPointerCapture(e.pointerId); }catch(err){}
      clearTimeout(lpTimer);
      if(o && o.userData.tapeId && o.userData.tapeId !== 'demo'){
        lpTimer = setTimeout(() => {
          if(rackDown && rackDown.obj === o && !rackDown.moved){ rackDown.long = true; sfx('tick'); askDelete(o.userData.tapeId); }
        }, 600);
      }
      return;
    }
    down = {x:e.clientX, y:e.clientY, t:performance.now(), wheel:false};
    if(playerMode){
      try{ renderer.domElement.setPointerCapture(e.pointerId); }catch(err){}
      if(pick(e) === 'vol'){ down.wheel = true; down.vol = state.vol; down.angle = state.wheelTarget || 0; }
    }
  });
  renderer.domElement.addEventListener('pointermove', e => {
    if(rackMode){
      if(!rackDown || !R) return;
      const dx = e.clientX - rackDown.x, dy = e.clientY - rackDown.y;
      if(Math.hypot(dx, dy) > 7) rackDown.moved = true;
      const upp = 2 * R.dist * Math.tan(degR(16)) / stage.clientHeight;
      rackYT = clampRack(rackDown.y0 + dy * upp);
      return;
    }
    if(!playerMode || !down || !pm) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if(down.wheel){
      const upx = pm.fh / stage.clientHeight / 1.5;
      const along = pm.portrait ? -dy : dx;
      state.wheelTarget = down.angle + (pm.portrait ? dy : dx) * upx;
      const v = Math.max(1, Math.min(10, down.vol + Math.round(along / 22)));
      if(v !== state.vol){
        ensureAudio();
        state.vol = v; sfx('tick'); setBed();
      }
      return;
    }
    par.tx = Math.max(-2, Math.min(2, -dx * 0.012));
    par.ty = Math.max(-2, Math.min(2, dy * 0.012));
  });
  const release = e => {
    if(rackMode){
      clearTimeout(lpTimer);
      const d = rackDown; rackDown = null;
      if(d && !d.moved && !d.long && e.type === 'pointerup' && d.obj && !busy && !sheetOpen){
        if(d.obj.userData.act === 'new') newTape();
        else chooseTape(tapes.find(t => t.id === d.obj.userData.tapeId));
      }
      return;
    }
    if(!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
    const quick = performance.now() - down.t < 450;
    const wasWheel = down.wheel;
    down = null;
    par.tx = 0; par.ty = 0;
    if(e.type === 'pointerup' && moved < 7 && quick && !(wasWheel && moved > 2)){ const a = pick(e); if(a) press(a); }
  };
  renderer.domElement.addEventListener('pointerup', release);
  renderer.domElement.addEventListener('pointercancel', release);
  let lastHover = 0;
  renderer.domElement.addEventListener('pointermove', e => {
    if(e.pointerType !== 'mouse' || e.buttons) return;
    const now = performance.now(); if(now - lastHover < 60) return; lastHover = now;
    renderer.domElement.classList.toggle('hot', rackMode ? !!rackPick(e) : !!pick(e));
  });

  // ---------- resize ----------
  function onResize(){
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
    if(playerMode) buildPM();
    if(rackMode){ buildRack(); fitRackCam(); }
  }
  window.addEventListener('resize', onResize);

  // ---------- loop ----------
  const clock = new THREE.Clock();
  let wheelAngle = 0;
  syncUI();
  let busyT = 0, tickErr = false;
  function tick(){
    requestAnimationFrame(tick);
    try{ frame(); }catch(err){ if(!tickErr){ tickErr = true; console.error(err); } }
  }
  function frame(){
    const dt = Math.min(clock.getDelta(), 0.05);
    if(busy){ busyT += dt; if(busyT > 16){ busy = false; fadeEl.classList.remove('on'); } } else busyT = 0;

    // tape transport
    let v = 0;
    const md = state.mode;
    if(md === 'play'){
      v = 2.0;
      if(ac && tape.ready && ac.state === 'running'){ if(!deck.loading) state.pos = Math.max(state.pos, deck.startPos + Math.max(0, ac.currentTime - deck.startTime)); }
      else state.pos += dt;
    } else if(md === 'ff' || md === 'rew'){
      v = md === 'ff' ? 18 : -18;
      state.pos += (md === 'ff' ? 30 : -30) * dt;
    }
    if(state.pos >= tape.total){
      state.pos = tape.total;
      if(md !== 'stop'){ setMode('stop'); sfx('stop'); say('AUTO STOP: テープの終わりで止まりました。'); }
    }
    if(state.pos <= 0){ state.pos = 0; if(md === 'rew'){ setMode('stop'); sfx('stop'); } }
    const p = state.pos / tape.total;
    const rL = 0.72 + 1.08 * (1 - p), rR = 0.72 + 1.08 * p;
    [mainCas, pm && pm.cas].forEach(c => {
      if(!c) return;
      c.reelL.pack.scale.set(rL, 1, rL); c.reelR.pack.scale.set(rR, 1, rR);
      if(v){ c.reelL.hub.rotation.z -= (v / rL) * dt; c.reelR.hub.rotation.z -= (v / rR) * dt; }
    });
    // the drive spindles turn with the reels they drive
    mainSpindles[0].rotation.z = mainCas.reelL.hub.rotation.z; mainSpindles[1].rotation.z = mainCas.reelR.hub.rotation.z;
    if(pm){ pm.spindles[0].rotation.z = pm.cas.reelL.hub.rotation.z; pm.spindles[1].rotation.z = pm.cas.reelR.hub.rotation.z; }
    const cn = Math.floor(state.pos) % 1000;
    ui.ctr.textContent = String(cn).padStart(3, '0');
    if(cn !== ctrShown){ ctrShown = cn; drawCounter(cn); }

    // keys
    Object.entries(keys).forEach(([id, k]) => {
      if(k.flash > 0) k.flash -= dt;
      const goal = Math.max(k.target, k.flash > 0 ? 1 : 0, (id === 'ff' && state.mode === 'ff') || (id === 'rew' && state.mode === 'rew') ? 1 : 0);
      k.down += (goal - k.down) * Math.min(1, dt * 22);
      k.mesh.position.y = TOP - 0.2 - k.down * 0.24;
      if(pm && pm.keys[id]) pm.keys[id].position.z = 0.2 - k.down * 0.4;
    });

    // door
    state.door += (state.doorTarget - state.door) * Math.min(1, dt * (state.doorTarget ? 5.5 : 8.5));
    if(state.latch && state.doorTarget === 0 && state.door < 0.04){ state.latch = false; sfx('close'); }
    const ease = state.door;
    doorPivot.rotation.x = ease * (1.05 + casAnim.wide * 0.45);
    runTweens(dt);
    const out = casAnim.out, sl = casAnim.slide, tl = casAnim.tilt;
    // main view: lifts straight out of the bay, then rises away over the opened door
    mainCas.group.position.set(0, bay.y + sl * 14, 0.55 + out * 1.9 + sl * 2.5);
    mainCas.group.rotation.x = tl * 0.18 + sl * 0.2;
    mainCas.group.visible = sl < 0.98;
    if(pm){
      pm.door.rotation.x = ease * (1.0 + casAnim.wide * 0.5);
      pm.cas.group.position.set(
        pm.casAt.x + pm.exit.x * sl * 17,
        pm.casAt.y + pm.exit.y * sl * 17,
        -1.3 + out * 2.8 + sl * 1.5);
      if(pm.portrait) pm.cas.group.rotation.y = -tl * 0.18;
      else pm.cas.group.rotation.x = tl * 0.18;
      pm.cas.group.visible = sl < 0.98;
    }

    // wheel
    if(state.wheelTarget !== undefined){
      wheelAngle += (state.wheelTarget - wheelAngle) * Math.min(1, dt * 14);
      wheel.rotation.y = wheelAngle;
      if(pm){ if(pm.wheelAxis === 'x') pm.wheel.rotation.x = wheelAngle; else pm.wheel.rotation.y = wheelAngle; }
    }

    // led
    led.material.emissiveIntensity += ((state.mode !== 'stop' ? 2.4 : 0) - led.material.emissiveIntensity) * Math.min(1, dt * 10);

    // camera tween (orbit view)
    if(camTween){
      const c = camTween;
      c.t = Math.min(1, c.t + dt * (reduceMotion ? 6 : 1.4));
      const e = c.t < 0.5 ? 4 * c.t * c.t * c.t : 1 - Math.pow(-2 * c.t + 2, 3) / 2;
      camera.position.lerpVectors(c.p0, c.p1, e);
      camera.up.lerpVectors(c.u0, c.u1, e).normalize();
      camera.fov = c.f0 + (c.f1 - c.f0) * e; camera.updateProjectionMatrix();
      camTarget.lerpVectors(c.t0, c.t1, e);
      camera.lookAt(camTarget);
      if(c.t >= 1){ camTween = null; camera.up.copy(c.u1); if(c.done) c.done(); }
    } else if(controls.enabled){
      controls.update();
    }

    renderer.shadowMap.needsUpdate = true;
    if(rackMode && R){
      updateRack(dt);
      renderer.render(rackScene, rackCam);
    } else if(playerMode && pm){
      appear = Math.min(1, appear + dt * 1.6);
      const e = 1 - Math.pow(1 - appear, 3);
      const pk = Math.min(1, dt * (down ? 14 : 5));
      par.x += (par.tx - par.x) * pk; par.y += (par.ty - par.y) * pk;
      pmCam.position.set(par.x, par.y, pm.dist * (1 + 0.5 * (1 - e)));
      pmCam.up.set(Math.sin((1 - e) * 0.25), Math.cos((1 - e) * 0.25), 0);
      pmCam.lookAt(par.x * 0.2, par.y * 0.2, 0);
      renderer.render(pmScene, pmCam);
    } else {
      renderer.render(scene, camera);
    }
  }
  if((window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone) enterPlayer();
  renderer.domElement.addEventListener('webglcontextlost', e => {
    e.preventDefault();
    const l = $('#loading'); l.hidden = false; l.style.zIndex = 7;
    l.textContent = '画面の描画が止まりました。ページを再読み込みすると元に戻ります。作ったテープは残っています。';
  });
  tick();
}
})();
</script>

<script>
if('serviceWorker' in navigator){ addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
document.addEventListener('gesturestart', e => e.preventDefault());
</script>
</body>
</html>
